name: Scanner Bot
on:
  schedule:
    - cron: '0 16 * * *'   # 8:00 AM PT
    - cron: '0 0 * * *'    # 4:00 PM PT
    - cron: '0 8 * * *'    # midnight PT
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Vulnerability pattern'
        type: choice
        options:
          - rotate
          - shell-injection
          - shell-injection-body
          - shell-injection-headref
          - shell-injection-actor
          - dangerous-triggers
      dry-run:
        description: 'Dry run'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
      - name: Run bot
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PATTERN: ${{ inputs.pattern || 'rotate' }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args="--queue --limit 100 --pattern $PATTERN"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          ruby -Ilib -Ibot bot/scanner_bot.rb $args
